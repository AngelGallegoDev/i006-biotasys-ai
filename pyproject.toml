[project]
name = "fastapi-ai-template"
version = "1.0.0"
description = "FastAPI template with OpenRouter AI integration"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.2",
    "python-dotenv>=1.0.0",
    "passlib[bcrypt]>=1.7.4",
    "supabase>=2.28.0",
    "google-genai>=1.63.0",
    "python-multipart>=0.0.22",
    "xhtml2pdf==0.2.17",
    "jinja2==3.1.6",
]

[project.optional-dependencies]


[project.urls]
Homepage = "https://github.com/your-username/template-python-fastapi"
Repository = "https://github.com/your-username/template-python-fastapi"
Documentation = "https://github.com/your-username/template-python-fastapi#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:The 'timeout' parameter is deprecated:DeprecationWarning:supabase.*",
    "ignore:The 'verify' parameter is deprecated:DeprecationWarning:supabase.*",
    "ignore:Pydantic V1 style `@validator` is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest>=7.0.0",
    "ruff>=0.15.1",
    "pre-commit>=4.1.0",
    "polyfactory>=3.2.0",
]
